services:
  - type: web
    name: sfu-student-full
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: SFU_TZ
        value: Asia/Krasnoyarsk
      - key: SSL_VERIFY
        value: "true"
    disk:
      name: sfu-student-data
      mountPath: /var/data
      sizeGB: 1
